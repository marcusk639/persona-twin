[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persona-twin"
version = "0.1.0"
description = "Personality-modeling corpus from a person's own writing"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/persona_twin"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
